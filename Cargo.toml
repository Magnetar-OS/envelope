[package]
name = "envelope"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Envelope — mail for the COSMIC desktop"
repository = "https://github.com/Magnetar-OS/envelope"
rust-version = "1.98.1"

[dependencies]
# --- the shared PIM substrate (MPL-2.0) ---
# Registry versions: cosmic-pim 1.0.0 is on crates.io. `accounts` is shared with
# Slate and Circle — one account, one password, one file. `mail` is the engine:
# the message model, the maildir store, threading, and IMAP.
cosmic-pim-accounts = "1.0.0"
cosmic-pim-mail = "1.0.0"
# The dispatch layer: one sync pass per account, over whichever protocol the
# account says. Envelope stopped running its own IMAP-only pass the day the
# substrate could route all five.
cosmic-pim-sync = "1.0.0"
# The OAuth flow: sign-in in the user's own browser, and token renewal. What
# turns "Gmail needs an app password" into "sign in with Google".
cosmic-pim-auth = "1.0.0"

# --- the text engine (MPL-2.0) ---
# Nib began here, as the composer's quoting, wrapping and undo, and outgrew the
# application. What went back out is the whole of what this file used to call
# `crate::text`:
#
# - `nib-model` is the document — the schema, the positions, the steps, and the
#   history that makes Ctrl+Z a property of the model rather than a stack of
#   whole-body snapshots the composer kept beside the widget.
# - `nib-text` is `text/plain` in and out: what a quote is, how deep it goes,
#   where a signature starts, and the wrap column an outgoing body gets.
# - `nib` is the widget, which — unlike libcosmic's `text_editor` — can be
#   given an id and focused without panicking the pinned revision.
#
# All four from git, at a tag, rather than from crates.io — even the three that
# are published there. The widget cannot be published at all, because it depends
# on libcosmic and libcosmic is not on crates.io; and a build that took the
# widget from git and the model from the registry would have two
# `cosmic-ext-nib-model` crates from two sources, whose `Node` types are not the
# same type. One source or the other, and the widget decides which.
#
# Nib's libcosmic is unpinned and from the same URL as ours, so cargo unifies
# the two rather than building both.
nib = { git = "https://github.com/Magnetar-OS/cosmic-ext-nib.git", tag = "v1.1.0", package = "cosmic-ext-nib" }
# HTML into a document, for the reader. Not a renderer of arbitrary HTML: the
# schema is the allow-list, so a `<script>`, a `<style>` and an inline
# `style=` are dropped because there is nowhere in the model to put them —
# and an `<img>` becomes a node that draws a placeholder rather than a
# request. See `ui::reader` for why that is the display-security position
# rather than a retreat from it.
nib-html = { git = "https://github.com/Magnetar-OS/cosmic-ext-nib.git", tag = "v1.1.0", package = "cosmic-ext-nib-html" }
nib-model = { git = "https://github.com/Magnetar-OS/cosmic-ext-nib.git", tag = "v1.1.0", package = "cosmic-ext-nib-model" }
nib-text = { git = "https://github.com/Magnetar-OS/cosmic-ext-nib.git", tag = "v1.1.0", package = "cosmic-ext-nib-text" }

i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.12"
open = "5.4"
tokio = { version = "1.53", features = ["full"] }
# The bus: the iMIP hand-off to the calendar rides the same connection
# libcosmic already owns for single-instance. Version pinned to libcosmic's.
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

dirs = "7"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = ["about", "single-instance", "wgpu", "xdg-portal"]

[[bin]]
name = "envelope"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3"
