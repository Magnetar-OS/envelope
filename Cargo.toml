[package]
name = "envelope"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Envelope — mail for the COSMIC desktop"
repository = "https://github.com/Magnetar-OS/envelope"
rust-version = "1.98.0"

[dependencies]
# --- the shared PIM substrate (MPL-2.0) ---
# Paths until cosmic-pim is pushed; then git tags. `accounts` is shared with
# Slate and Circle — one account, one password, one file. `mail` is the engine:
# the message model, the maildir store, threading, and IMAP.
cosmic-pim-accounts = { path = "../cosmic-pim/crates/cosmic-pim-accounts" }
cosmic-pim-mail = { path = "../cosmic-pim/crates/cosmic-pim-mail" }
# The dispatch layer: one sync pass per account, over whichever protocol the
# account says. Envelope stopped running its own IMAP-only pass the day the
# substrate could route all five.
cosmic-pim-sync = { path = "../cosmic-pim/crates/cosmic-pim-sync" }
# The OAuth flow: sign-in in the user's own browser, and token renewal. What
# turns "Gmail needs an app password" into "sign in with Google".
cosmic-pim-auth = { path = "../cosmic-pim/crates/cosmic-pim-auth" }

i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.12"
open = "5.4"
tokio = { version = "1.53", features = ["full"] }
# The bus: the iMIP hand-off to the calendar rides the same connection
# libcosmic already owns for single-instance. Version pinned to libcosmic's.
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

dirs = "7"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = ["about", "single-instance", "wgpu", "xdg-portal"]

[[bin]]
name = "envelope"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3"
